<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ConstruOn - Pedreiros e Ajudantes (Aracruz)</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1>ConstruOn — Pedreiros, Ajudantes e Empreiteiras</h1>
    <p>Região: Aracruz, Barra do Riacho, Vila do Riacho, Barra do Sahy</p>
  </header>

  <main>
    <section class="search">
      <input id="q" placeholder="Pesquisar por nome, contato ou especialidade" />
      <select id="role">
        <option value="">Todas as funções</option>
        <option value="pedreiro">Pedreiro</option>
        <option value="ajudante">Ajudante</option>
        <option value="empreiteira">Empreiteira</option>
      </select>
      <select id="region">
        <option value="">Todas as regiões</option>
      </select>
      <button id="searchBtn">Buscar</button>
    </section>

    <section class="results" id="results"></section>

    <hr />

    <section class="forms">
      <h2>Cadastre-se</h2>
      <div class="tabs">
        <button data-role="pedreiro" class="tab active">Pedreiro</button>
        <button data-role="ajudante" class="tab">Ajudante</button>
        <button data-role="empreiteira" class="tab">Empreiteira</button>
      </div>

      <form id="form" onsubmit="return false;">
        <input type="hidden" id="formRole" value="pedreiro" />
        <label>Nome: <input id="name" required /></label>
        <label>Contato: <input id="contact" required /></label>
        <label>Região: <input id="regionInput" placeholder="Ex: Barra do Riacho" /></label>

        <div id="pedreiroFields">
          <label>Valor da diária (R$): <input id="daily_rate" type="number" step="0.01" /></label>
          <label>Disponibilidade: <input id="availability" placeholder="Ex: imediato, flexível" /></label>
          <fieldset>
            <legend>Especialidades</legend>
            <label><input type="checkbox" name="specialty" value="alvenaria" /> Alvenaria</label>
            <label><input type="checkbox" name="specialty" value="acabamento" /> Acabamento</label>
            <label><input type="checkbox" name="specialty" value="piso" /> Piso</label>
            <label><input type="checkbox" name="specialty" value="pintura" /> Pintura</label>
            <label><input type="checkbox" name="specialty" value="eletrica" /> Elétrica</label>
            <label><input type="checkbox" name="specialty" value="outra" /> Outra: <input id="specialty_other" placeholder="especificar" /></label>
          </fieldset>
          <label>Tempo de experiência (anos): <input id="experience_years" type="number" min="0" step="1" /></label>
        </div>

        <div id="ajudanteFields" style="display:none">
          <label>Idade: <input id="age" type="number" /></label>
          <label>Tempo de experiência (anos): <input id="experience" /></label>
        </div>

        <div id="empreiteiraFields" style="display:none">
          <label>Site da empresa: <input id="company_site" /></label>
          <label>Nº de funcionários: <input id="employees_count" type="number" /></label>
          <label>Tempo de empresa (anos): <input id="company_age" type="number" /></label>
        </div>

        <div id="photosSection">
          <label>Fotos dos serviços: <input id="photos" type="file" accept="image/*" multiple /></label>
          <div id="photoPreview" class="photo-preview"></div>
        </div>

        <button id="submitBtn">Enviar cadastro</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
